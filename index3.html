<!DOCTYPE html>
<html lang="it">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18° Diciottesimo - Ivonne Mascali</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --rose-dust: #C8A2C8;
            --rose-pastel: #E8C5CE;
            --rose-gold: #D8A7B1;
            --rose-deep: #9E7B86;
            --silver-bright: #E8ECEF;
            --silver-light: #D1D5DB;
            --silver-mid: #C0C0C0;
            --silver-dark: #8A95A5;
            --bg-dark: #121013;
            --bg-card: #1C181D;
            --text-light: #E0E4E8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .card-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #29222a 0%, #121013 80%);
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(216, 167, 177, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem 1.5rem 1.5rem;
            border-left: 1px solid rgba(192, 192, 192, 0.15);
            border-right: 1px solid rgba(192, 192, 192, 0.15);
        }

        @media (min-height: 700px) and (min-width: 480px) {
            .card-container {
                min-height: 850px;
                border-radius: 24px;
                margin: 20px 0;
                border: 1px solid rgba(192, 192, 192, 0.3);
            }
        }

        .glitter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
            background-image: 
                radial-gradient(2px 2px at 15px 25px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 45px 75px, #fce4ec, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 85px 35px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 115px, #d8a7b1, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 185px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 295px 245px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 360px 75px, #f8bbd0, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 175px 285px, #e8c5ce, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 35px 195px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 265px 335px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 125px 215px, #f48fb1, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 325px 145px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 70px 150px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 50px, #e8c5ce, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 310px 30px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 150px 150px;
        }

        .glitter-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.75;
            background-image: 
                radial-gradient(2px 2px at 25px 85px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 105px 165px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 185px 225px, #e8c5ce, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 245px 65px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 305px 185px, #fce4ec, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 65px 295px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 110px 110px;
        }

        .frame-border {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(192, 192, 192, 0.35);
            border-radius: 16px;
            pointer-events: none;
            z-index: 2;
        }

        .frame-border::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px dashed rgba(232, 197, 206, 0.25);
            border-radius: 12px;
        }

        .balloon-group {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        .balloon-top-left {
            top: -20px;
            left: -30px;
            width: 230px;
            height: 230px;
            opacity: 0.92;
        }

        .balloon-top-right {
            top: -20px;
            right: -30px;
            width: 230px;
            height: 230px;
            transform: scaleX(-1);
            opacity: 0.92;
        }

        .balloon-bottom-left {
            bottom: -20px;
            left: -30px;
            width: 170px;
            height: 170px;
            opacity: 0.6;
        }

        .balloon-bottom-right {
            bottom: -20px;
            right: -30px;
            width: 170px;
            height: 170px;
            transform: scaleX(-1);
            opacity: 0.6;
        }

        .balloon-svg {
            width: 100%;
            height: 100%;
        }

        .content {
            z-index: 4;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            padding: 1rem 0;
        }

        .number-18 {
            font-family: 'Cinzel', serif;
            font-size: 5.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--silver-bright) 0%, var(--silver-mid) 30%, var(--rose-pastel) 60%, var(--silver-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.2rem;
            text-shadow: 0 0 20px rgba(192, 192, 192, 0.2);
            letter-spacing: 2px;
        }

        .name {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: var(--rose-pastel);
            margin-bottom: 1.2rem;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 0 10px rgba(232, 197, 206, 0.3);
            line-height: 1.1;
            padding: 0 10px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--silver-mid), transparent);
            margin: 0.5rem 0 1.5rem 0;
        }

        .event-details {
            margin-bottom: 1.8rem;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--silver-bright);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .time {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--rose-gold);
            font-weight: 400;
        }

        .location-container {
            margin-bottom: 0.5rem;
        }

        .location-title {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--rose-pastel);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .location-address {
            font-size: 0.9rem;
            color: var(--silver-mid);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .buttons-container {
            z-index: 5;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding-bottom: 1.8rem;
            margin-top: 0.5rem;
        }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .btn-wrapper:hover {
            transform: translateY(-4px);
        }

        .btn-label {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--silver-bright);
            text-transform: uppercase;
        }

        .btn-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(232, 236, 239, 0.1) 0%, rgba(200, 162, 200, 0.15) 100%);
            border: 1px solid var(--rose-pastel);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--rose-pastel);
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-wrapper:hover .btn-circle {
            background: linear-gradient(135deg, var(--rose-dust) 0%, var(--rose-deep) 100%);
            color: var(--silver-bright);
            border-color: var(--silver-bright);
            box-shadow: 0 0 15px rgba(232, 197, 206, 0.4);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 8, 12, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(145deg, #221c24, #151217);
            border: 1px solid var(--rose-gold);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(216, 167, 177, 0.2);
            position: relative;
            transform: translateY(30px);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--silver-mid);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--rose-pastel);
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            color: var(--rose-pastel);
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .modal-subtitle {
            font-size: 0.8rem;
            color: var(--silver-mid);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--silver-bright);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(232, 236, 239, 0.05);
            border: 1px solid rgba(192, 192, 192, 0.25);
            border-radius: 10px;
            color: var(--silver-bright);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--rose-pastel);
            background: rgba(232, 236, 239, 0.08);
        }

        .radio-group {
            display: flex;
            gap: 1rem;
        }

        .radio-btn {
            flex: 1;
            position: relative;
        }

        .radio-btn input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .radio-label {
            display: block;
            text-align: center;
            padding: 0.7rem;
            background: rgba(232, 236, 239, 0.05);
            border: 1px solid rgba(192, 192, 192, 0.25);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--silver-light);
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-btn input:checked + .radio-label {
            background: var(--rose-deep);
            border-color: var(--rose-pastel);
            color: var(--silver-bright);
            box-shadow: 0 0 10px rgba(200, 162, 200, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--rose-gold) 0%, var(--rose-deep) 100%);
            color: var(--silver-bright);
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(216, 167, 177, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }

        .success-icon {
            font-size: 3rem;
            color: var(--rose-pastel);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="glitter-overlay"></div>
        <div class="frame-border"></div>

        <svg style="width:0;height:0;position:absolute;">
            <defs>
                <radialGradient id="balloonPink" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#F5E1E6"/>
                    <stop offset="50%" stop-color="#D8A7B1"/>
                    <stop offset="100%" stop-color="#7A5661"/>
                </radialGradient>
                <radialGradient id="balloonSilver" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#E8ECEF"/>
                    <stop offset="35%" stop-color="#C0C0C0"/>
                    <stop offset="70%" stop-color="#8A95A5"/>
                    <stop offset="100%" stop-color="#4A525D"/>
                </radialGradient>
            </defs>
        </svg>

        <div class="balloon-group balloon-top-left">
            <svg class="balloon-svg" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="50" rx="26" ry="34" fill="url(#balloonSilver)"/>
                <path d="M40 84 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="130" cy="45" rx="28" ry="36" fill="url(#balloonPink)"/>
                <path d="M130 81 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="70" cy="70" rx="36" ry="46" fill="url(#balloonSilver)"/>
                <path d="M70 116 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
                <ellipse cx="115" cy="80" rx="32" ry="42" fill="url(#balloonSilver)"/>
                <path d="M115 122 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
                <ellipse cx="150" cy="95" rx="24" ry="30" fill="url(#balloonPink)"/>
                <path d="M150 125 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="90" cy="110" rx="30" ry="38" fill="url(#balloonSilver)"/>
                <path d="M90 148 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
            </svg>
        </div>

        <div class="balloon-group balloon-top-right">
            <svg class="balloon-svg" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="40" cy="50" rx="26" ry="34" fill="url(#balloonPink)"/>
                <path d="M40 84 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="130" cy="45" rx="28" ry="36" fill="url(#balloonSilver)"/>
                <path d="M130 81 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="70" cy="70" rx="36" ry="46" fill="url(#balloonSilver)"/>
                <path d="M70 116 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
                <ellipse cx="115" cy="80" rx="32" ry="42" fill="url(#balloonPink)"/>
                <path d="M115 122 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
                <ellipse cx="150" cy="95" rx="24" ry="30" fill="url(#balloonSilver)"/>
                <path d="M150 125 L70 170" stroke="#C0C0C0" stroke-width="1"/>
                <ellipse cx="90" cy="110" rx="30" ry="38" fill="url(#balloonSilver)"/>
                <path d="M90 148 L70 170" stroke="#C0C0C0" stroke-width="1.2"/>
            </svg>
        </div>

        <div class="balloon-group balloon-bottom-left">
            <svg class="balloon-svg" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="50" cy="120" rx="28" ry="36" fill="url(#balloonSilver)"/>
                <ellipse cx="85" cy="135" rx="25" ry="32" fill="url(#balloonPink)"/>
                <ellipse cx="110" cy="150" rx="22" ry="28" fill="url(#balloonSilver)"/>
            </svg>
        </div>

        <div class="balloon-group balloon-bottom-right">
            <svg class="balloon-svg" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="50" cy="120" rx="28" ry="36" fill="url(#balloonSilver)"/>
                <ellipse cx="85" cy="135" rx="25" ry="32" fill="url(#balloonSilver)"/>
                <ellipse cx="110" cy="150" rx="22" ry="28" fill="url(#balloonPink)"/>
            </svg>
        </div>

        <div class="content">
            <div class="number-18">18</div>
            <h1 class="name">Ivonne Mascali</h1>
            <div class="divider"></div>

            <div class="event-details">
                <p class="date">Mercoledì 25 Novembre</p>
                <p class="time">Ore 20:00</p>
            </div>

            <div class="location-container">
                <h2 class="location-title">Ristorante Sole Mare</h2>
                <p class="location-address">Capomulini, Acireale</p>
            </div>
        </div>

        <div class="buttons-container">
            <div class="btn-wrapper" id="mapBtn">
                <div class="btn-circle">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <span class="btn-label">Mappa</span>
            </div>

            <div class="btn-wrapper" id="rsvpBtn">
                <div class="btn-circle">
                    <i class="fa-solid fa-check"></i>
                </div>
                <span class="btn-label">Conferma</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="rsvpModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="formContainer">
                <h3 class="modal-title">Conferma Presenza</h3>
                <p class="modal-subtitle">Facci sapere se sarai dei nostri per festeggiare insieme!</p>

                <form id="rsvpForm">
                    <div class="form-group">
                        <label for="guestName">Nome e Cognome</label>
                        <input type="text" id="guestName" class="form-control" placeholder="Inserisci il tuo nome" required>
                    </div>

                    <div class="form-group">
                        <label>Parteciperai?</label>
                        <div class="radio-group">
                            <div class="radio-btn">
                                <input type="radio" id="attendYes" name="attendance" value="si" checked>
                                <label for="attendYes" class="radio-label">Sì, ci sarò!</label>
                            </div>
                            <div class="radio-btn">
                                <input type="radio" id="attendNo" name="attendance" value="no">
                                <label for="attendNo" class="radio-label">Non posso</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="allergies">Note / Intolleranze alimentari</label>
                        <input type="text" id="allergies" class="form-control" placeholder="Es. vegetariano, allergie...">
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">INVIA CONFERMA</button>
                </form>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h3 class="modal-title">Grazie!</h3>
                <p class="modal-subtitle" style="margin-top: 10px;">La tua risposta è stata registrata con successo.</p>
            </div>
        </div>
    </div>

    <script>
        // INSERISCI QUI SOTTO IL TUO LINK DI GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxq0BnDnY-PV9oW4oVjHWRx-WDSj2ILHslQkH0oY8g6xcY6k2dXRiqIXzI7Wj8BJ8h3/exec";

        // Mappa
        document.getElementById('mapBtn').addEventListener('click', function() {
            window.open('https://maps.google.com/?q=Ristorante+Sole+Mare+Capomulini+Acireale', '_blank');
        });

        // Modal RSVP
        const rsvpBtn = document.getElementById('rsvpBtn');
        const rsvpModal = document.getElementById('rsvpModal');
        const closeModal = document.getElementById('closeModal');
        const rsvpForm = document.getElementById('rsvpForm');
        const formContainer = document.getElementById('formContainer');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        rsvpBtn.addEventListener('click', () => {
            rsvpModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => {
            rsvpModal.classList.remove('active');
        });

        rsvpModal.addEventListener('click', (e) => {
            if (e.target === rsvpModal) {
                rsvpModal.classList.remove('active');
            }
        });

        // Invio dati a Google Sheets
        rsvpForm.addEventListener('submit', (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = 'INVIANDO...';

            const payload = {
                nome: document.getElementById('guestName').value,
                presenza: document.querySelector('input[name="attendance"]:checked').value === 'si' ? 'Sì, ci sarò!' : 'Purtroppo non posso',
                note: document.getElementById('allergies').value || '-'
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                formContainer.style.display = 'none';
                successMessage.style.display = 'block';

                setTimeout(() => {
                    rsvpModal.classList.remove('active');
                    setTimeout(() => {
                        formContainer.style.display = 'block';
                        successMessage.style.display = 'none';
                        rsvpForm.reset();
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'INVIA CONFERMA';
                    }, 400);
                }, 2500);
            })
            .catch(error => {
                alert("Si è verificato un errore durante l'invio. Riprova.");
                submitBtn.disabled = false;
                submitBtn.innerText = 'INVIA CONFERMA';
            });
        });
    </script>
</body>
</html>
